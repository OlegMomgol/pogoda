{% extends "base.html" %}

{% block title %}Главная — Погода{% endblock %}

{% block content %}
<form action="{{ url_for('weather') }}" method="POST" class="weather-form">
    <label for="city">Введите название города:</label>
    <input type="text" id="city" name="city" placeholder="Например: Москва" required>
    <button type="submit">Узнать погоду</button>
</form>
{% endblock %}
